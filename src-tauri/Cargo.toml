[package]
name = "ym-dl"
version = "1.4.2"
description = "Загрузчик Яндекс.Музыки"
authors = ["ym-dl"]
edition = "2021"
rust-version = "1.88"

[lib]
name = "ym_dl_lib"
# Desktop-only build: the mobile crate types (staticlib/cdylib) are not needed
# and the cdylib export table overflows MinGW's ordinal limit.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `protocol-asset` is what lets the webview stream a local audio file for
# playback; without it the asset protocol stays disabled at build time.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
aes = "0.8"
ctr = "0.9"
directories = "6"
# System credential store: Windows Credential Manager, Secret Service on Linux.
# The token is a password to the music account and does not belong in a plain file.
keyring = { version = "4", features = ["v1"] }
anyhow = "1"
lofty = "0.22"
tauri-plugin-clipboard-manager = "2"
# Pure-Rust audio: decoding (to check a written file really plays) and the
# FLAC/AAC sources that MP3 export converts from. Nothing external has to be
# installed or looked up on PATH.
symphonia = { version = "0.5", default-features = false, features = [
    "flac",
    "aac",
    "mp3",
    "isomp4",
    "pcm",
    "wav",
] }
# MP3 export. Bundles the LAME sources and compiles them with the system C
# compiler, so the binary carries the encoder and needs nothing installed.
mp3lame-encoder = "0.3"
# Local index of downloaded tracks. `bundled` compiles SQLite in, so neither
# Windows nor Linux needs a system package.
rusqlite = { version = "0.32", features = ["bundled"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
