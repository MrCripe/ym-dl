[package]
name = "ym-dl"
version = "2.0.0"
description = "Загрузчик Яндекс.Музыки"
authors = ["ym-dl"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "ym_dl_lib"
# Desktop-only build: the mobile crate types (staticlib/cdylib) are not needed
# and the cdylib export table overflows MinGW's ordinal limit.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "stream",
    "rustls-tls",
    "charset",
    "http2",
] }
futures-util = "0.3"
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
aes = "0.8"
ctr = "0.9"
directories = "6"
anyhow = "1"
lofty = "0.22"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
