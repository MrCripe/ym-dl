name: release polish

# Everything that has to happen *after* a release is published.
#
# tauri-action writes latest.json while the release is still a draft, and a draft
# has no browser download URL — so the manifest ends up pointing at
# api.github.com/repos/…/releases/assets/<id>, which answers with JSON metadata
# instead of the file. The in-app updater then downloads that JSON and fails the
# signature check. Publishing the release fixes nothing by itself.
#
# The same pass removes the `.sig` files from the asset list (they are only for
# the updater, which reads the signature out of latest.json, and they read as
# noise to a person picking a download) and rewrites the release body from
# CHANGELOG.md.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег опубликованного релиза (например v1.2.0)"
        required: true

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.release.tag_name || github.event.inputs.tag }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Point latest.json at the release assets
        run: node scripts/fix-updater-json.mjs "$REPO" "$TAG"

      - name: Drop the signature files from the asset list
        run: |
          # latest.json carries each signature inline, so the separate .sig assets
          # are only clutter for anyone choosing what to download.
          gh api "repos/$REPO/releases/tags/$TAG" --jq '.assets[].name' |
            grep '\.sig$' |
            while read -r name; do
              echo "removing $name"
              gh release delete-asset "$TAG" "$name" --repo "$REPO" --yes
            done

      - name: Write the release body from the changelog
        run: node scripts/release-notes.mjs "$REPO" "$TAG"

      - name: Check the manifest downloads
        run: |
          # Read the asset itself, not /releases/latest/download/: that path is
          # served by a CDN which still holds the copy written before the fix.
          asset_id=$(gh api "repos/$REPO/releases/tags/$TAG" \
            --jq '.assets[] | select(.name=="latest.json") | .id')
          body=$(gh api "repos/$REPO/releases/assets/$asset_id" \
            -H "Accept: application/octet-stream")
          echo "$body" | head -c 400
          echo
          # Every platform entry must be a release download link, not an API asset.
          if echo "$body" | grep -q 'api.github.com/repos/.*/releases/assets/'; then
            echo "::error::latest.json всё ещё указывает на API-адреса"
            exit 1
          fi

          # The manifest is useless if the file it names cannot be fetched.
          url=$(echo "$body" | grep -o 'https://github.com/[^"]*x64-setup.exe' | head -1)
          if [ -z "$url" ]; then
            echo "::error::в latest.json нет ссылки на установщик"
            exit 1
          fi
          code=$(curl -s -o /dev/null -w '%{http_code}' -L "$url")
          echo "$url -> HTTP $code"
          if [ "$code" != "200" ]; then
            echo "::error::по ссылке из манифеста файл не скачивается"
            exit 1
          fi
