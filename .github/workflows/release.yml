name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег, под которым собрать релиз (например v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
            label: windows
          - platform: ubuntu-22.04
            args: ""
            label: linux
          # Native build for Apple Silicon: macos-latest is an arm64 runner, which
          # is what current Macs run. An Intel bundle would need a second job.
          - platform: macos-latest
            args: ""
            label: macos

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libappindicator3-dev conflicts with libayatana-appindicator3-dev;
          # only the ayatana fork exists on current Ubuntu.
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend dependencies
        run: npm ci

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test --release

      - name: Type check
        run: npx tsc --noEmit

      # tauri-action builds the bundles and attaches them to the release of the
      # tag. A draft is created so nothing goes public before the assets are
      # actually there and verified.
      #
      # The signing key lets the app verify that an update really comes from this
      # repository before installing it, and includeUpdaterJson writes the
      # manifest the in-app updater reads.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "ym-dl ${{ github.event.inputs.tag || github.ref_name }}"
          # NSIS is preferred on Windows: the setup.exe replaces the installed
          # build silently, while the .msi cannot install over itself without a
          # reboot. The manifest itself (latest.json) is written by default.
          updaterJsonPreferNsis: true
          releaseBody: |
            Загрузчик Яндекс.Музыки с интерфейсом на Material Design 3.

            Что нового и какие файлы скачивать — смотрите в описании релиза
            (заполняется автоматически из CHANGELOG.md).
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # A plain archive with the already-built program, for anyone who does not
      # want an installer.
      #
      # On Linux the archive holds the AppImage, not the bare binary: the binary
      # needs the distribution's WebKitGTK and GTK installed, while the AppImage
      # carries them inside, so "unpack and run" is actually true there.
      - name: Portable archive
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $stage = "portable-windows"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item "src-tauri/target/release/ym-dl.exe" $stage
          # Marker for the app: this copy has no installer to replace, so the
          # built-in updater must not promise an in-place update.
          New-Item -ItemType File -Path "$stage/portable" | Out-Null
          @"
          ym-dl $version — портативная сборка для Windows
          ================================================

          Запустите ym-dl.exe. Устанавливать ничего не нужно.

          Рядом с exe появится папка ym-dl-data: в ней настройки и профиль окна.
          Чтобы перенести программу на другой компьютер, скопируйте всю папку
          целиком. Токен хранится в системном хранилище паролей Windows, а не в
          этой папке.

          Нужен установленный WebView2 — он есть в Windows 10 и 11 по умолчанию.
          Если окно не открывается, поставьте "Evergreen WebView2 Runtime" от
          Microsoft.

          Ничего доустанавливать не нужно: FLAC, AAC и MP3 приложение разбирает
          само, ffmpeg ему не требуется.
          "@ | Set-Content "$stage/ЧИТАТЬ.txt" -Encoding utf8
          Compress-Archive -Path "$stage/*" -DestinationPath "ym-dl_${version}_windows-portable.zip" -Force
          gh release upload $env:TAG "ym-dl_${version}_windows-portable.zip" --clobber

      - name: Portable archive
        if: matrix.platform == 'ubuntu-22.04'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        run: |
          version="${TAG#v}"
          stage="portable-linux"
          mkdir -p "$stage"
          appimage=$(ls src-tauri/target/release/bundle/appimage/*.AppImage | head -1)
          cp "$appimage" "$stage/ym-dl.AppImage"
          chmod +x "$stage/ym-dl.AppImage"
          cat > "$stage/README.txt" <<EOF
          ym-dl $version — портативная сборка для Linux
          ==============================================

          Распакуйте архив и запустите ./ym-dl.AppImage. Устанавливать ничего не
          нужно: нужные библиотеки (GTK, WebKitGTK) уже внутри.

          Если система не разрешает запуск AppImage, включите FUSE:
            Arch:   sudo pacman -S fuse2
            Fedora: sudo dnf install fuse
            Ubuntu: sudo apt install libfuse2
          Либо распакуйте AppImage и запустите содержимое напрямую:
            ./ym-dl.AppImage --appimage-extract
            ./squashfs-root/AppRun

          Настройки лежат в папке ym-dl-data рядом с программой. Токен хранится
          в системном хранилище паролей (Secret Service / GNOME Keyring).

          Ничего доустанавливать не нужно: FLAC, AAC и MP3 приложение разбирает
          само, ffmpeg ему не требуется.
          EOF
          tar -czf "ym-dl_${version}_linux-portable.tar.gz" -C "$stage" .
          gh release upload "$TAG" "ym-dl_${version}_linux-portable.tar.gz" --clobber
